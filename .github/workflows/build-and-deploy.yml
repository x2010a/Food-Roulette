name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0"   # every Monday 4am Singapore time (Sunday 20:00 UTC)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write   # to commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refresh the data on the weekly schedule, on manual runs,
      # or if the data file doesn't exist yet. Ordinary code pushes reuse
      # the committed data so we don't hit OpenStreetMap on every push.
      - name: Set up Python
        if: github.event_name != 'push' || hashFiles('site/data/places.json') == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh food places from OpenStreetMap
        if: github.event_name != 'push' || hashFiles('site/data/places.json') == ''
        run: |
          pip install requests
          python scripts/build_data.py

      - name: Commit refreshed data
        if: github.event_name != 'push' || hashFiles('site/data/places.json') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh food places data"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
